schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: diffusion_made_easy
  Goal: educational implementation of diffusion models from scratch — clear,
  minimal, well-documented code for learning how diffusion (DDPM-style) and
  related generative models work, rather than maximum performance.
  Tech stack: Python, PyTorch.
  Language: code/comments/docstrings in English; discussions and specs may be
  in Russian or English.
  Conventions: small focused modules, runnable examples, keep dependencies
  minimal.

