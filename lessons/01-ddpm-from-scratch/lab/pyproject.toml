[project]
name = "ddpm-lab"
version = "0.1.0"
description = "Lesson 01 lab: train a DDPM diffusion model on MNIST from scratch (PyTorch + Lightning)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # PyTorch + Lightning stack. Torch wheels include CUDA libraries via pip index (see [tool.uv]).
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "lightning>=2.2,<3",
    "tensorboard>=2.15",
    "omegaconf>=2.3,<3",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

# Tell uv to fetch CUDA-enabled torch wheels from the PyTorch index by default.
[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "platform_system != 'Darwin'" }]
torchvision = [{ index = "pytorch-cu121", marker = "platform_system != 'Darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ddpm_lab"]
