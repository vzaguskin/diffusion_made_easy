[project]
name = "score-lab"
version = "0.1.0"
description = "Lesson 02 lab: score matching on 2D toy data, annealed Langevin, VE vs VP on MNIST"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Deliberately lighter than lesson 01: no lightning / tensorboard here —
    # 2D models train in minutes and the *plots themselves* are the lab output.
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",   # MNIST for the VE/VP comparison
    "numpy>=1.24",
    "matplotlib>=3.7",
    "omegaconf>=2.3,<3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

# Same CUDA wheel source as lesson 01 for GPU support.
[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "platform_system != 'Darwin'" }]
torchvision = [{ index = "pytorch-cu121", marker = "platform_system != 'Darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score_lab"]
